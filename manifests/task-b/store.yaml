apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: object-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 4Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: objects
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: objects
  template:
    metadata:
      labels:
        app: objects
    spec:
      containers:
      - name: store
        image: ${STORAGE_IMAGE}
        command: ["weed"]
        args:
          - "mini"
          - "-dir=/data"
          - "-s3.config=/auth/s3.json"
        ports:
          - containerPort: 8333
            name: s3
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: "1"
            memory: 1Gi
        readinessProbe:
          tcpSocket:
            port: s3
          initialDelaySeconds: 5
          periodSeconds: 3
        volumeMounts:
        - name: data
          mountPath: /data
        - name: auth
          mountPath: /auth
          readOnly: true
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: object-data
      - name: auth
        secret:
          secretName: s3-config
---
apiVersion: v1
kind: Service
metadata:
  name: objects
spec:
  type: ClusterIP
  ports:
    - port: 8333
      targetPort: s3
      name: s3
  selector:
    app: objects
